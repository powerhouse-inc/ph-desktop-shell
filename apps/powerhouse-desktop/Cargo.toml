# The Powerhouse-identity desktop app: the first consumer of ph-desktop-shell.
# Identity (productName, identifier, icons, file associations) is entirely in
# tauri.conf.json; this crate is the generate_context! + run() stub that every
# builder shell replicates with its own config.
[package]
name = "powerhouse-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
# Plugins must ALSO be direct dependencies of the app crate: tauri-build only
# sees permission manifests (shell:allow-spawn etc.) from direct deps.
tauri-plugin-shell = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
ph-desktop-shell = { path = "../../crates/ph-desktop-shell" }

[[bin]]
name = "ph-win"
path = "src/main.rs"
