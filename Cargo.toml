[workspace]
resolver = "2"
members = ["crates/ph-desktop-shell", "apps/powerhouse-desktop"]

[workspace.package]
version = "0.1.0-dev.3"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/powerhouse-inc/ph-desktop-shell"

[workspace.dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
tauri-build = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
